<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Marvel Rivals Randomizer</title>
    </head>
    <body>
        <select id="numPlayers" onchange="updatePlayerInputs()" style="font-size: 20px; padding: 5px;">
            <option value="" disabled selected>Select # of Players</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select>

        <div id="playerInputs"></div>
        <div id="results"></div>
        
        <button onclick="randomize()">randomize</button>
        <script>
            function updatePlayerInputs() {
                const num = document.getElementById("numPlayers").value;
                const container = document.getElementById("playerInputs");
                container.innerHTML = "";

                for(let i = 0; i < num; i++) {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.style.display = "block";
                    input.style.marginBottom = "10px";
                    input.placeholder = `Player ${i + 1} name`;
                    container.appendChild(input);
                }
            }

            async function randomize() {
                const inputs = document.querySelectorAll("#playerInputs input");
                const playerNames = Array.from(inputs).map(input => input.value);

                const response = await fetch("/randomize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(playerNames)
                });
                const result = await response.json();
                const container = document.getElementById("results");
                container.innerHTML = ""; // clear old results
                result.forEach(player => {
                    const div = document.createElement("div");
                    div.innerHTML = `<h2>${player.name} -> ${player.character.name}</h2>`;
                    container.appendChild(div);
                });
            }
        </script>
    </body>
</html>
